name: Auto Create Pull Request

on:
  push:
    branches-ignore: [main, gh-pages]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          echo "Branch: $BRANCH"
          echo "Commit: $GITHUB_SHA"
          echo "Actor:  $GITHUB_ACTOR"

          OPEN_PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN_PR" ]; then
            echo "Open PR #$OPEN_PR already exists — skipping."
            exit 0
          fi

          echo "No open PR found. Creating..."
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Merge $BRANCH into main" \
            --body "Auto PR: $GITHUB_ACTOR pushed to \`$BRANCH\` (commit \`$GITHUB_SHA\`)"
