name: Auto Create Pull Request

on:
  push:
    branches-ignore: [main, gh-pages]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          EXISTS=$(gh pr list --head "$BRANCH" --base main --json number --jq length)
          if [ "$EXISTS" -eq 0 ]; then
            BODY="## Auto-generated Pull Request

          **Branch:** \`$BRANCH\`
          **Commit:** \`$GITHUB_SHA\`
          **Author:** $GITHUB_ACTOR

          ---
          Triggered automatically on push to \`$BRANCH\`."

            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Merge $BRANCH into main" \
              --body "$BODY"
            echo "Pull request created for branch: $BRANCH"
          else
            echo "PR already exists for branch: $BRANCH — skipping."
          fi
