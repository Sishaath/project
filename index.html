<!DOCTYPE html>                                                                                                                 
  <html lang="en">                       
  <head>                                                                                                                          
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />                                                      
    <meta http-equiv="Content-Security-Policy"                                                                                    
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 
  https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:;" />                                         
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />                                                                          
    <title>CalcSpace</title>                                
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />               
    <style>                                                                                                                       
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
                                                                                                                                  
      :root {                                               
        --bg: #0a0a0f;
        --panel: #111118;                                                                                                         
        --border: rgba(255,255,255,0.07);
        --accent: #84e0a3;                                                                                                        
        --accent-dim: rgba(132,224,163,0.12);               
        --text: #e8e8f0;                                                                                                          
        --muted: #6b6b80;                                                                                                         
        --btn: #1a1a24;                                                                                                           
        --radius: 12px;                                                                                                           
      }                                                                                                                           
   
      body {                                                                                                                      
        min-height: 100vh;                                  
        background: var(--bg);
        font-family: 'DM Sans', sans-serif;
        color: var(--text);                                                                                                       
        display: flex;
        align-items: center;                                                                                                      
        justify-content: center;                            
        padding: 24px;
        background-image:                                                                                                         
          radial-gradient(ellipse 80% 60% at 50% -10%, rgba(132,224,163,0.09) 0%, transparent 60%),
          radial-gradient(ellipse 40% 40% at 85% 80%, rgba(80,120,200,0.07) 0%, transparent 60%);                                 
      }                                                                                                                           
                                                                                                                                  
      .calc {                                                                                                                     
        width: 320px;                                       
        background: var(--panel);                                                                                                 
        border: 1px solid var(--border);                    
        border-radius: var(--radius);
        padding: 24px;                                                                                                            
        box-shadow: 0 32px 64px rgba(0,0,0,0.4), 0 0 0 1px rgba(132,224,163,0.05);
        animation: rise 0.4s cubic-bezier(.22,.68,0,1.2) both;                                                                    
      }                                                                                                                           
                                                                                                                                  
      @keyframes rise {                                                                                                           
        from { opacity: 0; transform: translateY(20px) scale(0.97); }
        to   { opacity: 1; transform: none; }
      }                                                                                                                           
   
      .title { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }    
      .title span { color: var(--accent); }                 
                                                                                                                                  
      .display {                                            
        background: rgba(0,0,0,0.3);                                                                                              
        border: 1px solid var(--border);                    
        border-radius: 10px;
        padding: 16px 20px;                                                                                                       
        margin-bottom: 20px;
        text-align: right;                                                                                                        
        min-height: 80px;                                                                                                         
        display: flex;
        flex-direction: column;                                                                                                   
        justify-content: flex-end;                          
        gap: 4px;                                                                                                                 
      }
                                                                                                                                  
      .display-expr { font-size: 0.8rem; color: var(--muted); min-height: 18px; overflow: hidden; text-overflow: ellipsis;        
  white-space: nowrap; }
      .display-val  { font-size: 2.2rem; font-weight: 300; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }      
                                                                                                                                  
      .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }                                                  
                                                                                                                                  
      button {                                                                                                                    
        padding: 18px 8px;                                  
        border: 1px solid var(--border);
        border-radius: 10px;                                                                                                      
        background: var(--btn);
        color: var(--text);                                                                                                       
        font-family: 'DM Sans', sans-serif;                 
        font-size: 1rem;                                                                                                          
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;                                                                             
        user-select: none;                                                                                                        
      }
      button:hover  { background: rgba(255,255,255,0.07); }                                                                       
      button:active { transform: scale(0.93); }                                                                                   
   
      .btn-op    { color: var(--accent); }                                                                                        
      .btn-clear { color: #ff5c5c; }                        
      .btn-eq    { background: var(--accent); color: #0a0a0f; font-weight: 500; border-color: transparent; }                      
      .btn-eq:hover { opacity: 0.88; background: var(--accent); }                                                                 
    </style>                                                                                                                      
  </head>                                                                                                                         
  <body>                                                    
                                                                                                                                  
  <div class="calc">                                        
    <div class="title">Calc<span>Space</span> — Basic</div>
    <div class="display">                                                                                                         
      <div class="display-expr" id="expr"></div>
      <div class="display-val"  id="val">0</div>                                                                                  
    </div>                                                                                                                        
    <div class="grid">
      <button class="btn-clear" onclick="pressClear()">C</button>                                                                 
      <button class="btn-op"    onclick="pressBack()">⌫</button>
      <button class="btn-op"    onclick="pressPercent()">%</button>                                                               
      <button class="btn-op"    onclick="pressOp('/')">÷</button>                                                                 
                                                                                                                                  
      <button onclick="pressDigit('7')">7</button>                                                                                
      <button onclick="pressDigit('8')">8</button>          
      <button onclick="pressDigit('9')">9</button>                                                                                
      <button class="btn-op" onclick="pressOp('*')">×</button>
                                                                                                                                  
      <button onclick="pressDigit('4')">4</button>
      <button onclick="pressDigit('5')">5</button>                                                                                
      <button onclick="pressDigit('6')">6</button>                                                                                
      <button class="btn-op" onclick="pressOp('-')">−</button>
                                                                                                                                  
      <button onclick="pressDigit('1')">1</button>                                                                                
      <button onclick="pressDigit('2')">2</button>
      <button onclick="pressDigit('3')">3</button>                                                                                
      <button class="btn-op" onclick="pressOp('+')">+</button>
                                                                                                                                  
      <button onclick="pressNegate()">+/−</button>
      <button onclick="pressDigit('0')">0</button>                                                                                
      <button onclick="pressDigit('.')">.</button>          
      <button class="btn-eq" onclick="pressEquals()">=</button>                                                                   
    </div>
  </div>                                                                                                                          
                                                            
  <script>
    const elVal  = document.getElementById('val');
    const elExpr = document.getElementById('expr');
                                                                                                                                  
    let display = '', firstOp = null, operator = null, waiting = false, computed = false;
    const opLabel = { '+': '+', '-': '−', '*': '×', '/': '÷' };                                                                   
                                                                                                                                  
    function setVal(v)  { elVal.textContent  = v; }
    function setExpr(v) { elExpr.textContent = v; }                                                                               
                                                                                                                                  
    function pressDigit(d) {
      if (computed) { display = ''; computed = false; }                                                                           
      if (waiting)  { display = ''; waiting  = false; }     
      if (d === '.' && display.includes('.')) return;
      display = (display === '0' || display === '') && d !== '.' ? d : display + d;                                               
      setVal(display);
    }                                                                                                                             
                                                            
    function pressOp(op) {                                                                                                        
      const cur = parseFloat(display) || 0;
      if (firstOp !== null && !waiting) {                                                                                         
        const res = compute(firstOp, operator, cur);        
        display = fmt(res); setVal(display);
        firstOp = isFinite(res) ? res : cur;                                                                                      
      } else { firstOp = cur; }
      setExpr(fmt(firstOp) + ' ' + opLabel[op]);                                                                                  
      operator = op; waiting = true; computed = false;                                                                            
    }
                                                                                                                                  
    function pressEquals() {                                
      if (firstOp === null || operator === null) return;
      const cur = parseFloat(display) || 0;
      setExpr(fmt(firstOp) + ' ' + opLabel[operator] + ' ' + fmt(cur) + ' =');                                                    
      const res = compute(firstOp, operator, cur);
      display = fmt(res); setVal(display);                                                                                        
      firstOp = null; operator = null; waiting = false; computed = true;                                                          
    }
                                                                                                                                  
    function compute(a, op, b) {                            
      switch (op) {
        case '+': return a + b;                                                                                                   
        case '-': return a - b;
        case '*': return a * b;                                                                                                   
        case '/': return b === 0 ? NaN : a / b;             
      }
    }
                                                                                                                                  
    function fmt(n) { return !isFinite(n) ? 'Error' : String(Math.round(n * 1e10) / 1e10); }                                      
                                                                                                                                  
    function pressClear() {                                                                                                       
      display = ''; firstOp = null; operator = null; waiting = false; computed = false;
      setVal('0'); setExpr('');
    }

    function pressBack() {                                                                                                        
      if (computed) { pressClear(); return; }
      display = display.slice(0, -1); setVal(display || '0');                                                                     
    }                                                       

    function pressPercent() { display = fmt((parseFloat(display) || 0) / 100); setVal(display); computed = true; }                
    function pressNegate()  { display = fmt(-(parseFloat(display) || 0)); setVal(display); }
  </script>                                                                                                                       
                                                                                                                                  
  </body>
  </html>
